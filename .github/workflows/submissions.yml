name: Review site submissions
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
  id-token: write
concurrency:
  group: hn-atlas-submissions
  cancel-in-progress: false
jobs:
  review:
    if: github.event_name != 'issues' || github.event.label.name == 'approved' || github.event.label.name == 'rejected'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/submissions.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_ORIGIN: https://hn-atlas.pages.dev
