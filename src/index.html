<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f6">
  <meta name="description" content="A small, curated directory of active Hacker News projects. Books, videos, games, readers, and tools.">
  <title>Awesome HN — Hacker News projects, organized</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#directory">Skip to directory</a>
  <div class="page">
    <header>
      <a class="brand" href="/" aria-label="Awesome HN home"><span class="brand-icon" aria-hidden="true">hn</span><span>awesome hn<span class="dot">.</span></span></a>
      <a class="github-link" href="https://github.com/wa008/awesome-hn" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4 1-4-2-6-2m12 5v-4c0-1 .1-2-.5-2.5 3.5-.4 6.5-1.7 6.5-6A5 5 0 0 0 19.6 6c.1-1-.1-2-.6-3-1.5 0-3 1-3.5 1.5a13 13 0 0 0-7 0C8 4 6.5 3 5 3c-.5 1-.7 2-.6 3A5 5 0 0 0 3 9.5c0 4.3 3 5.6 6.5 6C9 16 9 17 9 18v4"/></svg><span>GitHub</span><span aria-hidden="true">↗</span></a>
    </header>
    <main>
      <div class="toolbar">
        <div class="intro"><h1>Hacker News, organized.</h1><p>Good projects from around the community.</p></div>
        <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" type="search" placeholder="Find a site…" aria-label="Search sites" autocomplete="off"><kbd aria-hidden="true">/</kbd></label>
      </div>
      <nav class="filters" aria-label="Directory sections"><button class="filter active" data-filter="all" aria-pressed="true">All <span>{{TOTAL}}</span></button>{{FILTERS}}<span class="result-status" id="result-status" role="status" aria-live="polite">{{TOTAL}} sites</span></nav>
      <div id="directory" class="directory">{{DIRECTORY}}</div>
      <div class="empty" id="empty" hidden><h2>No matching sites.</h2><p>Try another name or keyword.</p><button id="clear-search">Clear search ↗</button></div>
    </main>
    <footer><span>{{TOTAL}} sites <span class="footer-dot">·</span> Reviewed <time datetime="{{REVIEW_DATE}}">{{DISPLAY_DATE}}</time></span><div><a href="https://github.com/wa008/awesome-hn/blob/main/CURATION.md" target="_blank" rel="noopener noreferrer">Curation</a><a href="https://github.com/cheeaun/awesome-hacker-news" target="_blank" rel="noopener noreferrer">Reference ↗</a></div></footer>
  </div>
</body>
</html>
